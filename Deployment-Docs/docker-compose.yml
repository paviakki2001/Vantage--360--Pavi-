services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "VANTAGE360 AI Service"
      SERVICE_NAME: "vantage360-ai"
      ENVIRONMENT: "development"
      LOG_LEVEL: "INFO"
      API_V1_PREFIX: "/api/v1"
      API_V2_PREFIX: "/api/v2"
      DATA_SOURCE_MODE: "development_csv"
      MASTER_DATA_DIRECTORY: "/app/VANTAGE_Datasets/datasets"
      SERVICE_BASE_URL: "http://api:8000"
      SERVICE_TIMEOUT_SECONDS: "30"
      GATEWAY_AUTH_ENABLED: "true"
      GATEWAY_API_KEY: "${GATEWAY_API_KEY:?Set GATEWAY_API_KEY in your .env file}"
    restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      VANTAGE_API_URL: "http://api:8000"
      VANTAGE_API_KEY: "${GATEWAY_API_KEY:?Set GATEWAY_API_KEY in your .env file}"
    depends_on:
      - api
    restart: unless-stopped
